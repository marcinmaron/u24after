<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lista towarów - KLOCKI.net.pl</title>
<meta name="description" content="Lista towarów dostępnych w KLOCKI.net.pl po zamknięciu działalności.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F5FA; --ink:#14213D; --muted:#4A5772; --line:#D5DCEA;
  --red:#C8102E; --yellow:#F5B700; --blue:#2563C9; --green:#1F8A5B;
  --panel:#FFFFFF; --on-red:#FFFFFF; --head-bg:#E8EDF6;
  --head:"Bricolage Grotesque","Trebuchet MS",Arial,sans-serif;
  --body:"Figtree","Segoe UI",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0F1626; --ink:#EEF2FA; --muted:#A9B4CC; --line:#26314A; --panel:#17203A;
        --red:#E0364F; --yellow:#F5B700; --blue:#4C8BF0; --green:#34B27D; --head-bg:#1E2946}
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:1.0625rem;line-height:1.6;
  padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
.wrap{max-width:960px;margin:0 auto;padding:0 24px}
header{padding:28px 0 0;font-family:var(--head);font-weight:800;font-size:1.25rem;letter-spacing:.01em}
header a{color:inherit;text-decoration:none}
header span{color:var(--red)}

.back{display:inline-block;margin:28px 0 0;color:var(--blue);font-weight:600;text-decoration:none;padding:4px 0}
.back:hover{text-decoration:underline}
.back:focus-visible{outline:3px solid var(--blue);outline-offset:3px;border-radius:4px}

h1{font-family:var(--head);font-weight:800;font-size:clamp(2rem,6vw,3.5rem);line-height:1.05;letter-spacing:-.02em;margin:20px 0 14px}
.lead{color:var(--muted);max-width:56ch;margin:0 0 32px}

.panel{background:var(--panel);border:1px solid var(--line);border-left:8px solid var(--yellow);border-radius:10px;padding:8px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:520px}
th,td{padding:12px 14px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
th{font-family:var(--head);font-weight:700;background:var(--head-bg);white-space:nowrap}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--head-bg)}

#status{font-size:.95rem;color:var(--muted);margin:14px 0 0}
.empty{padding:24px 14px;color:var(--muted)}

.cta{margin:48px 0 56px;max-width:62ch}
.cta p{margin:0 0 14px}
.btn{display:inline-block;background:var(--red);color:var(--on-red);text-decoration:none;font-weight:600;
  font-size:1.05rem;padding:14px 26px;border-radius:8px;box-shadow:inset 0 -4px 0 rgba(0,0,0,.2)}
.btn:hover{filter:brightness(1.08)}
.btn:focus-visible{outline:3px solid var(--blue);outline-offset:3px}

footer{border-top:1px solid var(--line);padding:22px 0 32px;font-size:.9rem;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <header><a href="index.html">KLOCKI<span>.net.pl</span></a></header>

  <main>
    <a class="back" href="index.html">← Wróć na stronę główną</a>

    <h1>Lista towarów</h1>
    <p class="lead">Towary, które zostały nam po zamknięciu działalności. Lista odświeża się automatycznie.</p>

    <div class="panel">
      <div class="scroll"><div id="tabela"><p class="empty">Ładowanie…</p></div></div>
    </div>
    <p id="status" role="status"></p>

    <section class="cta">
      <p>Aby kupić bezpośrednio napisz na adres: u24after@gmail.com</p>
      <a class="btn" href="index.html">Wróć na stronę główną</a>
    </section>
  </main>

  <footer>© KLOCKI.net.pl</footer>
</div>

<script>
  const URL_DANYCH = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRSyzCFELGnHPt0kwgJMx9hgcHspqzl6WY90Lhqh_9hBNFWloCVnGFyMK3_2Akp1lXEDUbPpUAJc6WK/pub?gid=0&single=true&output=csv";
  const CO_ILE_MS = 60000; // odświeżanie co 60 s

  // Parser CSV zgodny ze standardem (RFC 4180): przecinki i cudzysłowy w komórkach są obsłużone
  function parsujCSV(tekst) {
    if (tekst.charCodeAt(0) === 0xFEFF) tekst = tekst.slice(1); // usuń BOM
    const wiersze = [];
    let wiersz = [], komorka = "", wCudzyslowie = false;

    for (let i = 0; i < tekst.length; i++) {
      const z = tekst[i];
      if (wCudzyslowie) {
        if (z === '"' && tekst[i + 1] === '"') { komorka += '"'; i++; }
        else if (z === '"') wCudzyslowie = false;
        else komorka += z;
      } else if (z === '"') {
        wCudzyslowie = true;
      } else if (z === ",") {
        wiersz.push(komorka); komorka = "";
      } else if (z === "\n" || z === "\r") {
        if (z === "\r" && tekst[i + 1] === "\n") i++;
        wiersz.push(komorka); wiersze.push(wiersz);
        wiersz = []; komorka = "";
      } else {
        komorka += z;
      }
    }
    if (komorka !== "" || wiersz.length) { wiersz.push(komorka); wiersze.push(wiersz); }
    return wiersze.filter(w => w.some(k => k.trim() !== ""));
  }

  function zbudujTabele(wiersze) {
    const tabela = document.createElement("table");
    const thead = document.createElement("thead");
    const tbody = document.createElement("tbody");

    wiersze.forEach((w, i) => {
      const tr = document.createElement("tr");
      w.forEach(k => {
        const kom = document.createElement(i === 0 ? "th" : "td");
        if (i === 0) kom.scope = "col";
        kom.textContent = k;               // dokładnie to, co w CSV, bez wstrzykiwania HTML
        tr.appendChild(kom);
      });
      (i === 0 ? thead : tbody).appendChild(tr);
    });

    tabela.append(thead, tbody);
    return tabela;
  }

  async function odswiez() {
    const kontener = document.getElementById("tabela");
    const status = document.getElementById("status");
    try {
      const odp = await fetch(URL_DANYCH + "&t=" + Date.now(), { cache: "no-store" });
      if (!odp.ok) throw new Error("HTTP " + odp.status);
      const wiersze = parsujCSV(await odp.text());

      if (wiersze.length === 0) {
        const p = document.createElement("p");
        p.className = "empty";
        p.textContent = "Brak towarów na liście.";
        kontener.replaceChildren(p);
      } else {
        kontener.replaceChildren(zbudujTabele(wiersze));
      }
      status.textContent = "Ostatnia aktualizacja: " + new Date().toLocaleTimeString("pl-PL");
    } catch (e) {
      console.error("Błąd odświeżania:", e);
      status.textContent = "Nie udało się odświeżyć danych. Spróbuj ponownie za chwilę.";
      if (!kontener.querySelector("table")) {
        const p = document.createElement("p");
        p.className = "empty";
        p.textContent = "Nie udało się wczytać listy towarów.";
        kontener.replaceChildren(p);
      }
    }
  }

  odswiez();
  setInterval(odswiez, CO_ILE_MS);
</script>
</body>
</html>
